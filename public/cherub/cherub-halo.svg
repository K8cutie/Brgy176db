    <circle cx="73" cy="72" r="3.8"/>
  </g>
  <circle cx="56.2" cy="70.8" r="1.1" fill="#FFFFFF"/>
  <circle cx="74.2" cy="70.8" r="1.1" fill="#FFFFFF"/>
