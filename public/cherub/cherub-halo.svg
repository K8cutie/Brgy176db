    <path d="M56 80 C50 54 40 32 22 24 C11 30 6 42 10 54 C17 53 21 57 26 65 C29 63 34 68 40 76 C43 74 48 78 52 86 C55 82 55 81 56 80 Z"/>
    <path d="M72 80 C78 54 88 32 106 24 C117 30 122 42 118 54 C111 53 107 57 102 65 C99 63 94 68 88 76 C85 74 80 78 76 86 C73 82 73 81 72 80 Z"/>
  </g>
  <g stroke="#E4C68F" stroke-width="1.1" fill="none" opacity="0.75" stroke-linecap="round">
    <path d="M50 76 C43 58 36 44 26 36"/>
    <path d="M51 82 C44 68 38 58 28 51"/>
    <path d="M78 76 C85 58 92 44 102 36"/>
    <path d="M77 82 C84 68 90 58 100 51"/>
