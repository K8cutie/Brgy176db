    <path d="M55 60 C50 38 42 22 26 14 C15 19 10 30 14 40 C20 39 23 43 27 50 C30 48 34 53 39 60 C42 58 46 62 49 68 C53 62 54 61 55 60 Z"/>
    <path d="M73 60 C78 38 86 22 102 14 C113 19 118 30 114 40 C108 39 105 43 101 50 C98 48 94 53 89 60 C86 58 82 62 79 68 C75 62 74 61 73 60 Z"/>
  </g>
  <!-- halo -->
