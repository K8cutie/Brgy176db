# Non-root nginx config for the ChurchOS SPA (used by the Dockerfile).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Bound how long a slow client can hold a worker (request-timeout hardening).
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 15s;

    # Content-hashed build assets → cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Serve /.well-known/security.txt (and any other real file) directly; only
    # fall back to index.html for client-side (BrowserRouter) routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
